name: corepack-probe
on: pull_request
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Does Corepack read .corepack.env?
        env:
          COREPACK_HOME: ${{ runner.temp }}/corepack-home
        run: |
          node --version
          corepack --version
          corepack enable pnpm
          if pnpm --version; then echo "RESULT: .corepack.env NOT read (download ok)"; else echo "RESULT: .corepack.env read (registry overridden)"; fi
